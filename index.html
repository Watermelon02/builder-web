  <!-- Visible before the entry bundle, React and the resource worker are ready. -->
  <div id="root">
    <div class="app-loading" role="status" aria-live="polite">
      <div class="app-loading__shade" aria-hidden="true"></div>
      <div class="app-loading__card">
        <span class="app-loading__logo" role="img" aria-label="月尘"></span>
        <div class="app-loading__track" aria-hidden="true"><span></span></div>
        <div class="app-loading__message">加载资源中…</div>
      </div>
    </div>
  </div>

  <script>
    globalThis.__legacyResourceMigration = (async function () {
      if (!('serviceWorker' in navigator)) return false;
      try {
        var workerUrl = new URL('/builder-web/service-worker.js', location.origin).href;
        var controller = navigator.serviceWorker.controller;
        var controlledByLegacyWorker = controller && controller.scriptURL === workerUrl;
        var regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(function (reg) {
          return [reg.active, reg.waiting, reg.installing].some(function (worker) {
            return worker && worker.scriptURL === workerUrl;
          });
        }).map(function (reg) { return reg.unregister(); }));

        // 注销不会解除当前页面的控制；在线时通过新导航退出旧缓存。
        if (controlledByLegacyWorker && !new URL(location.href).searchParams.has('_app_refresh')) {
          var freshUrl = new URL(location.href);
          freshUrl.searchParams.set('_app_refresh', String(Date.now()));
          var response = await fetch(freshUrl.href, { cache: 'no-store' });
          if (response.ok && (response.headers.get('content-type') || '').includes('text/html')) {
            location.replace(freshUrl.href);
            return true;
          }
        }
      } catch (error) {
        console.warn('暂时无法更新旧版缓存，将在下次打开时重试。', error);
      }
      return false;
    })();
  </script>
