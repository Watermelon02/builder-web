<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="horizontal-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111"/>
      <stop offset="0.5" stop-color="#383838"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="vertical-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="0.5" stop-color="#292929"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <pattern id="horizontal-fibers" width="8" height="8" patternUnits="userSpaceOnUse">
